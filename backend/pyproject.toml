[project]
name = "creatorjobs-backend"
version = "0.1.0"
description = "Standalone backend service for CreatorJobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "asyncpg>=0.29.0",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=46.0.5,<47.0.0",
  "bcrypt>=4.2.0",
  "greenlet>=3.0.3",
  "google-auth[requests]>=2.38.0,<3.0.0",
  "openai>=2.49.0,<3.0.0",
  "httpx>=0.28.1,<0.29.0",
  "httpcore>=1.0.9,<1.1.0",
  "babel>=2.17.0",
  "geonamescache>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI intentionally uses Depends/Query calls in defaults for DI metadata.
  "B008",
  # SQLAlchemy enum mappings currently rely on str+Enum behavior.
  "UP042",
]
