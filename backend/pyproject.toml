[project]
name = "creatorjobs-backend"
version = "0.1.0"
description = "Standalone backend service for CreatorJobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Security floor, not a preference: FastAPI below 0.141 pins `starlette<1.0.0`,
  # and every Starlette before 1.x is missing Host-header validation (which
  # poisons `request.url.path`) and is vulnerable to UNC-path traversal in
  # StaticFiles — which this service mounts, so that one is reachable.
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "asyncpg>=0.29.0",
  "python-jose[cryptography]>=3.3.0",
  # Floor is a security floor: 50.0.0 is the first release without the PKCS#7
  # Bleichenbacher oracle, the X.509 path-building and permittedSubtrees escapes,
  # and the vulnerable OpenSSL bundled in earlier wheels. The major bound stays
  # because this library gates OAuth credential and TOTP secret encryption, and a
  # major should be an explicit decision rather than a resolver's.
  "cryptography>=50.0.0,<51.0.0",
  "bcrypt>=4.2.0",
  "greenlet>=3.0.3",
  "google-auth[requests]>=2.38.0,<3.0.0",
  "openai>=2.49.0,<3.0.0",
  "httpx>=0.28.1,<0.29.0",
  "httpcore>=1.0.9,<1.1.0",
  # Shared production rate limiting. redis-py 8 supports Redis 7.2+; keep the
  # next major as an explicit protocol/response-shape migration.
  "redis>=8.1.0,<9.0.0",
  "babel>=2.17.0",
  "geonamescache>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI intentionally uses Depends/Query calls in defaults for DI metadata.
  "B008",
  # SQLAlchemy enum mappings currently rely on str+Enum behavior.
  "UP042",
]
