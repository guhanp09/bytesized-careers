version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorjobs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creatorjobs
      POSTGRES_PASSWORD: creatorjobs
      POSTGRES_DB: creatorjobs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorjobs -d creatorjobs"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorjobs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://creatorjobs:creatorjobs@postgres:5432/creatorjobs
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

volumes:
  postgres_data:
